<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1" />
  <title>Pokédex</title>
  <link rel="shortcut icon" href="/assets/pokeball.svg" type="image/x-icon" />
</head>

<body>
  <div class="app" id="app">
    <section class="container container__top">
      <div class="container display__data" id="display">
        <span>Waiting for parameters...</span>
      </div>
    </section>

    <section class="container container__middle">
      <div class="container container__dots" id="navigation__dots">
        <span id="type__filter__indicator" class="type-filter-indicator" style="display:none;"></span>
      </div>
      <div class="container container__navigation" id="navigation">
        <div class="nav-group">
          <input type="button" class="button nav-arrow" id="button__previous_pokemon" value="◀" title="Previous Pokémon (←)" />
          <span class="nav-group__label">Pokémon</span>
          <input type="button" class="button nav-arrow" id="button__next_pokemon" value="▶" title="Next Pokémon (→)" />
        </div>
        <div class="nav-group">
          <input type="button" class="button nav-arrow" id="button__previous_view" value="▲" title="Previous View (↑)" />
          <span class="nav-group__label">View</span>
          <input type="button" class="button nav-arrow" id="button__next_view" value="▼" title="Next View (↓)" />
        </div>
      </div>
    </section>
    <section class="container container__bottom" id="search">
      <div class="combobox" id="combobox">
        <input id="input__search" placeholder="Pokémon name/number" type="text" autocomplete="off" />
        <div class="combobox__dropdown" id="combobox__dropdown" role="listbox"></div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>

</html>
